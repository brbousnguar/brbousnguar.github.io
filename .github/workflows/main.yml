name: Generate Lighthouse Report

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Get Report
        run: |
          npm install -g lighthouse
          lighthouse https://heybrahim.com/ --chrome-flags="--headless" --output="json" --output-path="./report.json"
          cat ./report.json
